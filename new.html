<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Quiz Test - 20 Questions</title>
    <link rel="stylesheet" href="new.css">
</head>
<body>

    <div class="quiz-container">
        <!-- Start Screen -->
        <div id="start-screen" class="screen">
            <h1>Online Quiz Test</h1>
            <p>Test your knowledge with 20 questions!</p>
            <button id="start-btn" class="btn">Start Quiz</button>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="screen hidden">
            <div class="quiz-header">
                <span id="question-count">Question 1 of 20</span>
                <span id="timer">Time: 60s</span>
            </div>
            <div class="question-body">
                <h2 id="question-text">Loading question...</h2>
                <div id="options-container" class="options-grid">
                    <!-- Options will be injected via JS -->
                </div>
            </div>
            <button id="next-btn" class="btn hidden">Next Question</button>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="screen hidden">
            <h2>Quiz Completed!</h2>
            <p id="score-text">Your score: 0 out of 20</p>
            <button id="restart-btn" class="btn">Restart Quiz</button>
        </div>
    </div>

    <script src="new.js"></script>
</body>
</html>
